name: LeadPulse CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore src/LeadPulse.Api/LeadPulse.Api.csproj

      - name: Build
        run: dotnet build src/LeadPulse.Api/LeadPulse.Api.csproj --no-restore -c Release

      - name: Restore test dependencies
        run: dotnet restore src/LeadPulse.Tests/LeadPulse.Tests.csproj

      - name: Run tests
        run: dotnet test src/LeadPulse.Tests/LeadPulse.Tests.csproj --no-restore --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: src/LeadPulse.Tests/TestResults/

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/LeadPulse.Web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: src/LeadPulse.Web

      - name: Build Angular
        run: npx ng build --configuration=production
        working-directory: src/LeadPulse.Web

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend-build-test, frontend-build]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build API Docker image
        run: docker build -t leadpulse-api:latest .

      - name: Build Web Docker image
        run: docker build -t leadpulse-web:latest src/LeadPulse.Web/
